name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (fallback only)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the write head before the Rust build embeds it.
  write-head:
    name: Write head (fls-wh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # build the QNX cross binary in the fedora container (remote/ has its
      # own Containerfile with the cross toolchain)
      - name: Build in fedora container (podman)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman build -t fls-wh-builder remote/
          podman run --rm -v "$GITHUB_WORKSPACE":/src -w /src fls-wh-builder \
            make -C remote LD=aarch64-linux-gnu-ld STUB_LD=aarch64-linux-gnu-ld

      # the QNX binary can't run on a linux runner, so verify the artifact:
      # aarch64 ELF, QNX interpreter, correct SONAME and NEEDED entries
      - name: Verify artifact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          file remote/flswh-aarch64-qnx7 | grep -q 'ARM aarch64'
          file remote/flswh-aarch64-qnx7 | grep -q '/usr/lib/ldqnx-64.so.2'
          aarch64-linux-gnu-readelf -d remote/flswh-aarch64-qnx7 | grep -q 'NEEDED.*libc.so.5'
          aarch64-linux-gnu-readelf -d remote/stubs/libc.min.so_stub.so | grep -q 'SONAME.*libc.so.5'

      - name: Upload flswh-aarch64-qnx7
        uses: actions/upload-artifact@v4
        with:
          name: flswh-aarch64-qnx7
          path: remote/flswh-aarch64-qnx7
          if-no-files-found: error

  build-and-release:
    name: Build and Release (${{ matrix.target }})
    needs: write-head
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fls-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: fls-aarch64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: fls-aarch64-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fls-x86_64-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fls-aarch64-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: flswh-aarch64-qnx7
          path: remote/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-apple-darwin'
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          if [ -f "target/${{ matrix.target }}/release/fls" ]; then
            cp "target/${{ matrix.target }}/release/fls" "${{ matrix.artifact_name }}"
            ls -lh "${{ matrix.artifact_name }}"

            if command -v sha256sum &> /dev/null; then
              sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
            else
              shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
            fi
          fi
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

