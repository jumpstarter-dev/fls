name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # runs first: builds the write-head binaries and leaves them as artifacts
  # for later fls jobs (add `needs: write-head` + actions/download-artifact
  # in a job that wants them)
  write-head:
    name: Write head (fls-wh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # build the QNX cross binary in the fedora container (remote/ has its
      # own Containerfile with the cross toolchain)
      - name: Build in fedora container (podman)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman build -t fls-wh-builder remote/
          podman run --rm -v "$GITHUB_WORKSPACE":/src -w /src fls-wh-builder \
            make -C remote LD=aarch64-linux-gnu-ld STUB_LD=aarch64-linux-gnu-ld

      # the QNX binary can't run on a linux runner, so verify the artifact:
      # aarch64 ELF, QNX interpreter, correct SONAME and NEEDED entries
      - name: Verify artifact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          file remote/flswh-aarch64-qnx7 | grep -q 'ARM aarch64'
          file remote/flswh-aarch64-qnx7 | grep -q '/usr/lib/ldqnx-64.so.2'
          aarch64-linux-gnu-readelf -d remote/flswh-aarch64-qnx7 | grep -q 'NEEDED.*libc.so.5'
          aarch64-linux-gnu-readelf -d remote/stubs/libc.min.so_stub.so | grep -q 'SONAME.*libc.so.5'

      # runtime test: build the same source natively and drive it with a
      # framed command script against a temp file; assert records + bytes
      - name: Native test
        run: python3 remote/test.py

      # build the native (runner) binary too, kept for later fls testing
      - name: Build native
        run: make -C remote native

      - name: Upload flswh-aarch64-qnx7
        uses: actions/upload-artifact@v4
        with:
          name: flswh-aarch64-qnx7
          path: remote/flswh-aarch64-qnx7
          if-no-files-found: error

      - name: Upload flswh-x86_64-linux
        uses: actions/upload-artifact@v4
        with:
          name: flswh-x86_64-linux
          path: remote/flswh-x86_64-linux
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os}}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fls-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: fls-aarch64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: fls-aarch64-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fls-x86_64-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fls-aarch64-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-apple-darwin'
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          if [ -f "target/${{ matrix.target }}/release/fls" ]; then
            cp "target/${{ matrix.target }}/release/fls" "${{ matrix.artifact_name }}"
            ls -lh "${{ matrix.artifact_name }}"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error



